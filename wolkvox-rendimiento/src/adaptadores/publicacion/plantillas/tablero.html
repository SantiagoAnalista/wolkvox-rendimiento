<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulso de Operación</title>
<style>
/* ── Tokens ─────────────────────────────────────────────────────────
   Neutros cálidos, azul #1f3864 (el del Excel) reservado para cromo y
   nunca para series. La paleta categórica está validada para daltonismo
   en ambos modos; no cambiar los hex sin revalidar.                  */
:root {
  color-scheme: light;
  --plane:#f4f5f3; --surface:#fcfcfb; --surface-2:#f0efec;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --hair:rgba(11,11,11,.10); --hair-2:rgba(11,11,11,.06);
  --brand:#1f3864; --brand-ink:#1f3864; --brand-soft:#e7ecf5;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --bar-loud:#2a78d6; --bar-quiet:#86b6ef;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --delta-good:#006300; --delta-bad:#b02c2c;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835;
    --hair:rgba(255,255,255,.10); --hair-2:rgba(255,255,255,.06);
    --brand:#a8c4ee; --brand-ink:#a8c4ee; --brand-soft:#1d283a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --bar-loud:#3987e5; --bar-quiet:#184f95;
    --delta-good:#0ca30c; --delta-bad:#e66767;
    --shadow:none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835;
  --hair:rgba(255,255,255,.10); --hair-2:rgba(255,255,255,.06);
  --brand:#a8c4ee; --brand-ink:#a8c4ee; --brand-soft:#1d283a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --bar-loud:#3987e5; --bar-quiet:#184f95;
  --delta-good:#0ca30c; --delta-bad:#e66767;
  --shadow:none;
}

*{box-sizing:border-box}
/* .pick fija display, que gana sobre el [hidden] de la hoja del navegador. */
[hidden]{display:none !important}
body{margin:0;background:var(--plane);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 72px}

.top{border-bottom:1px solid var(--hair);background:var(--surface)}
.top-in{max-width:1240px;margin:0 auto;padding:22px 20px 20px;display:flex;
        flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;
         text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1{margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em;
   text-wrap:balance}
.top-meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right;line-height:1.7}
.top-meta b{color:var(--ink);font-weight:600}
.top-meta a{color:var(--brand-ink)}

.filters{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--hair)}
.filters-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;
            flex-wrap:wrap;gap:14px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{font:600 13.5px/1 var(--sans);color:var(--ink-2);background:none;border:0;
            padding:8px 15px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand-ink);box-shadow:var(--shadow)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
.pick{display:inline-flex;align-items:center;gap:8px}
.pick label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
select{font:500 13.5px var(--sans);color:var(--ink);background:var(--surface);
       border:1px solid var(--hair);border-radius:8px;padding:8px 11px;cursor:pointer}
.spacer{flex:1 1 auto}
.hint{font-size:12.5px;color:var(--muted);margin:0}

.foco{display:flex;gap:16px;align-items:flex-start;background:var(--surface);
      border:1px solid var(--hair);border-radius:var(--r);padding:16px 18px;
      margin-top:16px;box-shadow:var(--shadow)}
.foco-rail{width:3px;align-self:stretch;border-radius:2px;background:var(--brand);flex:none}
.foco h2{margin:0 0 3px;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.foco p{margin:0;font-size:13.5px;color:var(--ink-2);max-width:78ch}

.kpis{display:grid;gap:12px;margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(184px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);
     padding:14px 15px 13px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px}
.k-label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.k-value{font-size:30px;font-weight:650;letter-spacing:-.025em;line-height:1.1}
.k-value .u{font-size:17px;font-weight:500;color:var(--ink-2);margin-left:1px}
.k-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.k-meta{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.delta{font:600 11.5px/1 var(--mono);display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--delta-good)} .delta.down{color:var(--delta-bad)} .delta.flat{color:var(--muted)}

.grid{display:grid;gap:12px;margin-top:12px;grid-template-columns:repeat(12,1fr);
      align-items:start}   /* cada tarjeta con su alto: abrir una tabla no estira a la vecina */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);
      padding:16px 18px 14px;box-shadow:var(--shadow);min-width:0;grid-column:span 12}
.card.half{grid-column:span 6}
@media (max-width:900px){.card.half{grid-column:span 12}}
.card h3{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.card .sub{margin:3px 0 0;font-size:12.5px;color:var(--muted);max-width:72ch}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 2px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.lg i{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block}
.lg .glyph{width:15px;height:15px;border-radius:3px;flex:none;display:inline-flex;
           align-items:center;justify-content:center;font:700 9.5px/1 var(--sans)}

.plot{margin-top:10px;overflow-x:auto}
.plot svg{display:block}
text{font-family:var(--sans)}

details.tv{margin-top:12px;border-top:1px solid var(--hair-2);padding-top:9px}
details.tv summary{font-size:12.5px;color:var(--ink-2);cursor:pointer;font-weight:500;
                   list-style:none;display:inline-flex;align-items:center;gap:6px}
details.tv summary::-webkit-details-marker{display:none}
details.tv summary::before{content:"▸";font-size:10px;color:var(--muted)}
details.tv[open] summary::before{content:"▾"}
details.tv summary:hover{color:var(--ink)}

.tv-filtro{display:flex;align-items:center;gap:8px;margin:12px 0 0;flex-wrap:wrap}
.tv-filtro label{font-size:12px;color:var(--muted);text-transform:uppercase;
                 letter-spacing:.07em;font-weight:600}
.tv-filtro select{padding:6px 9px;font-size:12.5px}
.tw{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--hair-2);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
         font-weight:600;border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--surface)}
thead th span{font-weight:400;text-transform:none;letter-spacing:0}
tbody td{font-variant-numeric:tabular-nums;color:var(--ink-2)}
tbody td:first-child{color:var(--ink);font-weight:500}
tbody tr:last-child td{border-bottom:0}

.pill{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--sans);
      padding:4px 8px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.pill .g{font-size:10px}
.pill.ok{color:var(--delta-good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.pill.wa{color:#7a5200;background:color-mix(in srgb,var(--warn) 22%,transparent)}
.pill.se{color:#8a3d16;background:color-mix(in srgb,var(--serious) 22%,transparent)}
.pill.cr{color:var(--delta-bad);background:color-mix(in srgb,var(--crit) 14%,transparent)}
.pill.nu{color:var(--ink-2);background:var(--surface-2)}
:root[data-theme="dark"] .pill.wa,:root[data-theme="dark"] .pill.se{color:#f0d9a8}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .pill.wa,
  :root:not([data-theme="light"]) .pill.se{color:#f0d9a8}
}
.alertas{display:flex;flex-direction:column;gap:4px;align-items:flex-start}

#tip{position:fixed;z-index:90;pointer-events:none;opacity:0;transition:opacity .1s linear;
     background:var(--surface);color:var(--ink);border:1px solid var(--hair);border-radius:8px;
     padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:0 6px 20px rgba(11,11,11,.14);max-width:260px}
#tip .t-h{font-weight:650;margin-bottom:3px}
#tip .t-r{color:var(--ink-2);font-variant-numeric:tabular-nums}
#tip .t-r b{color:var(--ink);font-weight:600}

.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px;
       background:var(--surface-2);border-radius:8px;margin-top:10px}
.note{margin-top:10px;font-size:12px;color:var(--muted);border-left:2px solid var(--axis);
      padding-left:10px;max-width:80ch}

footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--hair);
       font-size:12.5px;color:var(--ink-2)}
footer p{margin:0 0 6px}
footer code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);
            padding:1px 5px;border-radius:4px}

:where(button,select,summary,a,[tabindex]):focus-visible{
  outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div>
      <p class="eyebrow">Wolkvox · Informe de gestión de asesores</p>
      <h1>Pulso de Operación</h1>
    </div>
    <div class="top-meta" id="meta"></div>
  </div>
</div>

<div class="filters">
  <div class="filters-in">
    <div class="seg" id="seg" role="group" aria-label="Alcance del tablero"></div>
    <div class="pick" id="pick">
      <label for="sel">Periodo</label>
      <select id="sel"></select>
    </div>
    <div class="pick" id="pick-dia" hidden>
      <label for="sel-dia">Día</label>
      <select id="sel-dia"></select>
    </div>
    <div class="spacer"></div>
    <p class="hint">Las cifras son las mismas del Excel de la corrida: el tablero no recalcula nada.</p>
  </div>
</div>

<div class="wrap">
  <div class="foco">
    <div class="foco-rail"></div>
    <div><h2 id="foco-t"></h2><p id="foco-p"></p></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="grid" id="grid"></div>
  <footer id="pie"></footer>
</div>

<div id="tip" role="status" aria-live="polite"></div>

<script id="datos" type="application/json">__PAYLOAD__</script>
<script>
"use strict";

const DATA = JSON.parse(document.getElementById("datos").textContent);
const PERIODOS = DATA.periodos || [];

const $ = (s, r = document) => r.querySelector(s);
const num = v => {
  if (typeof v === "number") return v;
  if (v == null) return null;
  const n = parseFloat(String(v).replace("%", "").replace(",", ".").trim());
  return Number.isFinite(n) ? n : null;
};
const fmt = (v, d = 1) => v == null ? "—"
  : v.toLocaleString("es-CO", { minimumFractionDigits: d, maximumFractionDigits: d });
const int = v => v == null ? "—" : Math.round(v).toLocaleString("es-CO");
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/** Identidad de un asesor, insensible a la grafía.
 *
 *  El mismo asesor llega escrito distinto según la fuente: cdr_1 y agent_8
 *  usan el nombre de la API ("CARDONA GARCIA  MARIA", con espacio doble) y la
 *  nómina el del YAML ("CARDONA GARCIA MARIA"). Cruzar por texto exacto hace
 *  que el semáforo no encuentre su fila y muestre ceros, o que el filtro
 *  liste dos veces a la misma persona. Es el mismo criterio que aplica
 *  `dominio.nombres.normalizar` del lado de Python. */
const clave = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/\s+/g, " ").trim().toUpperCase();

/** Nombres únicos por asesor, quedándose con la primera grafía vista. */
function porClave(filas) {
  const vistos = new Map();
  filas.forEach(r => { if (r.Agente) vistos.set(clave(r.Agente), r.Agente); });
  return [...vistos.values()];
}

/** "ALZATE VALENCIA CAROLINA" -> "Carolina Alzate".
 *  Wolkvox entrega APELLIDO1 APELLIDO2 NOMBRE1 [NOMBRE2]. */
const CACHE = new Map();
function corto(full) {
  if (CACHE.has(full)) return CACHE.get(full);
  const t = String(full).trim().split(/\s+/);
  const tc = w => w.charAt(0) + w.slice(1).toLowerCase();
  const nombre = t.length >= 3 ? t[2] : t[t.length - 1];
  const out = t.length < 2 ? tc(t[0]) : `${tc(nombre)} ${tc(t[0])}`;
  CACHE.set(full, out);
  return out;
}

/** Ink o blanco según la luminancia del relleno, para texto dentro de marcas. */
function sobre(tok) {
  const c = getComputedStyle(document.documentElement).getPropertyValue(tok).trim();
  const m = c.match(/^#?([0-9a-f]{6})$/i);
  if (!m) return "#fff";
  const n = parseInt(m[1], 16);
  const L = (0.2126 * (n >> 16 & 255) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) / 255;
  return L > 0.62 ? "#0b0b0b" : "#ffffff";
}

/* ── Tooltip ─────────────────────────────────────────────────────── */
const TIP = $("#tip");
function tipOn(e, html) {
  TIP.innerHTML = html;
  TIP.style.opacity = "1";
  const r = TIP.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  TIP.style.left = x + "px"; TIP.style.top = y + "px";
}
const tipOff = () => { TIP.style.opacity = "0"; };
function hover(el, html) {
  el.addEventListener("mousemove", e => tipOn(e, html));
  el.addEventListener("mouseleave", tipOff);
  el.setAttribute("tabindex", "0");
  el.addEventListener("focus", e => {
    const b = e.target.getBoundingClientRect();
    tipOn({ clientX: b.left + b.width / 2, clientY: b.top }, html);
  });
  el.addEventListener("blur", tipOff);
}

/* ── SVG ─────────────────────────────────────────────────────────── */
const NS = "http://www.w3.org/2000/svg";
function svg(tag, attrs = {}, parent = null) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] != null) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
/** Rect con radio por esquina: extremos de dato redondeados, base recta. */
function rrect(x, y, w, h, tl, tr, br, bl) {
  const r = Math.min(w, h) / 2;
  [tl, tr, br, bl] = [tl, tr, br, bl].map(v => Math.max(0, Math.min(v, r)));
  return `M${x + tl},${y}H${x + w - tr}${tr ? `a${tr},${tr} 0 0 1 ${tr},${tr}` : ""}` +
    `V${y + h - br}${br ? `a${br},${br} 0 0 1 ${-br},${br}` : ""}` +
    `H${x + bl}${bl ? `a${bl},${bl} 0 0 1 ${-bl},${-bl}` : ""}` +
    `V${y + tl}${tl ? `a${tl},${tl} 0 0 1 ${tl},${-tl}` : ""}Z`;
}
const AX = { fill: "var(--muted)", "font-size": "11" };

/* ── Piezas ──────────────────────────────────────────────────────── */
function card(cls, titulo, sub) {
  const c = document.createElement("section");
  c.className = "card" + (cls ? " " + cls : "");
  c.innerHTML = `<div><h3>${esc(titulo)}</h3>` + (sub ? `<p class="sub">${esc(sub)}</p>` : "") + `</div>`;
  return c;
}
function legend(items) {
  const d = document.createElement("div");
  d.className = "legend";
  d.innerHTML = items.map(i => `<span class="lg"><i style="background:${i.color}"></i>${esc(i.label)}</span>`).join("");
  return d;
}
function vistaTabla(cols, filas, etiqueta = "Ver los datos en tabla") {
  const d = document.createElement("details");
  d.className = "tv";
  d.innerHTML = `<summary>${esc(etiqueta)}</summary><div class="tw"><table><thead><tr>` +
    cols.map(c => `<th>${c}</th>`).join("") + `</tr></thead><tbody>` +
    filas.map(f => `<tr>${f.map(v => `<td>${v}</td>`).join("")}</tr>`).join("") +
    `</tbody></table></div>`;
  return d;
}
function vacio(txt) {
  const e = document.createElement("div");
  e.className = "empty";
  e.textContent = txt;
  return e;
}
const pill = (k, txt, glifo) => `<span class="pill ${k}"><span class="g">${glifo}</span>${esc(txt)}</span>`;

/* ── Estado de puntualidad ───────────────────────────────────────── */
const HHMM = s => { const [a, b] = String(s).split(":"); return (+a) * 60 + (+b); };
/** Minuto del día en que arranca la jornada pactada ("08:00-17:00"). */
const inicioJornada = fila => HHMM(String(fila["Horario"] || "08:00-17:00").split("-")[0]);

/* `Estado` puede venir como "Tarde", "Temprano", "Tarde y Temprano", "OK"
   o "Sin conexión"; hay que comprobar por inclusión, no por igualdad.
   `corteMin` solo llega en una jornada en curso: ahí "sin conexión" todavía
   no es una ausencia, es que la corrida se adelantó al asesor. */
function estadoPunt(fila, U, corteMin = null) {
  const e = String(fila["Estado"] ?? "");
  const min = num(fila["Min tarde"]) || 0;
  if (e.includes("Sin conexión")) {
    if (corteMin == null) return { k: "nu", tok: null, glifo: "–", txt: "Sin conexión" };
    const retraso = Math.round(corteMin - inicioJornada(fila));
    if (retraso <= U.tolerancia_min) return { k: "nu", tok: null, glifo: "·", txt: "Aún sin conectar" };
    return retraso > U.tarde_grave_min
      ? { k: "cr", tok: "--crit", glifo: "✕", txt: `Sin conectar · ${retraso} min` }
      : { k: "wa", tok: "--warn", glifo: "!", txt: `Sin conectar · ${retraso} min` };
  }
  if (e.includes("Tarde")) {
    const grave = min > U.tarde_grave_min;
    const extra = e.includes("Temprano") ? " y salió temprano" : "";
    return grave
      ? { k: "cr", tok: "--crit", glifo: "✕", txt: `Tarde ${fmt(min, 0)} min${extra}` }
      : { k: "wa", tok: "--warn", glifo: "!", txt: `Tarde ${fmt(min, 1)} min${extra}` };
  }
  if (e.includes("Temprano")) return { k: "se", tok: "--serious", glifo: "↰", txt: "Salió temprano" };
  return { k: "ok", tok: "--good", glifo: "✓", txt: "A tiempo" };
}
const colorEstado = st => st.tok ? `var(${st.tok})` : "var(--surface-2)";

/* ══ Distribución del tiempo (apilada al 100 %) ═══════════════════ */
const ESTADOS = [
  { k: "% En llamada", base: "En llamada", label: "En llamada", color: "var(--s1)", tok: "--s1" },
  { k: "% ACW", base: "ACW", label: "Cierre posterior (ACW)", color: "var(--s2)", tok: "--s2" },
  { k: "% Ring", base: "Ring", label: "Timbrando", color: "var(--s3)", tok: "--s3" },
  { k: "% Ready", base: "Ready", label: "Disponible sin gestionar", color: "var(--s4)", tok: "--s4" },
  { k: "% Auxiliar", base: "Auxiliar", label: "Fuera de línea (auxiliares)", color: "var(--s5)", tok: "--s5" }
];

function chartDistribucion(tiempos) {
  const c = card("half", "En qué se va la jornada",
    "Reparto del tiempo logueado de cada asesor. La barra suma 100 %, así que las anchuras se comparan entre asesores.");
  if (!tiempos.length) { c.appendChild(vacio("Sin tiempos registrados en el periodo.")); return c; }
  c.appendChild(legend(ESTADOS));

  const rows = [...tiempos].sort((a, b) => (num(b["% Auxiliar"]) || 0) - (num(a["% Auxiliar"]) || 0));
  const PAD_L = 118, PAD_R = 16, BH = 22, GAP_ROW = 16, TOP = 6, GAP = 2, W = 560;
  const H = TOP + rows.length * (BH + GAP_ROW);
  const plot = document.createElement("div"); plot.className = "plot";
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: H, role: "img" }, plot);
  const bw = W - PAD_L - PAD_R;

  rows.forEach((r, i) => {
    const y = TOP + i * (BH + GAP_ROW);
    svg("text", { x: PAD_L - 10, y: y + BH / 2 + 4, "text-anchor": "end",
                  fill: "var(--ink)", "font-size": "12", "font-weight": "500" }, s)
      .textContent = corto(r.Agente);

    const total = ESTADOS.reduce((a, e) => a + (num(r[e.k]) || 0), 0) || 100;
    let x = PAD_L;
    ESTADOS.forEach((e, j) => {
      const pct = num(r[e.k]) || 0;
      const raw = bw * pct / total;
      const last = j === ESTADOS.length - 1, first = j === 0;
      const w = Math.max(0, raw - (last ? 0 : GAP));
      if (raw <= 0.4) { x += raw; return; }
      const p = svg("path", { d: rrect(x, y, w, BH, first ? 4 : 0, last ? 4 : 0, last ? 4 : 0, first ? 4 : 0),
                              fill: e.color }, s);
      hover(p, `<div class="t-h">${esc(corto(r.Agente))}</div>` +
        `<div class="t-r">${esc(e.label)}: <b>${fmt(pct)} %</b></div>` +
        `<div class="t-r">Tiempo: <b>${esc(r[e.base] ?? "—")}</b></div>`);
      const txt = `${Math.round(pct)}%`;
      if (w >= txt.length * 7 + 14) {
        svg("text", { x: x + w / 2, y: y + BH / 2 + 4, "text-anchor": "middle",
                      fill: sobre(e.tok), "font-size": "11", "font-weight": "600",
                      "pointer-events": "none" }, s).textContent = txt;
      }
      x += raw;
    });
  });

  c.appendChild(plot);
  c.appendChild(vistaTabla(["Asesor", "Logueado", ...ESTADOS.map(e => esc(e.label))],
    rows.map(r => [esc(corto(r.Agente)), esc(r.Logueado ?? "—"),
      ...ESTADOS.map(e => fmt(num(r[e.k])) + " %")])));
  return c;
}

/* ══ Calendario de puntualidad ════════════════════════════════════ */
function chartCalendario(detalle, U) {
  const c = card("half", "Puntualidad, día por día",
    `Una celda por asesor y fecha. Distingue “llegó tarde 4 veces” de “llegó tarde 4 lunes”, que son problemas distintos. Tolerancia ${U.tolerancia_min} min.`);
  if (!detalle.length) { c.appendChild(vacio("Sin días laborales evaluados en el periodo.")); return c; }

  const d = document.createElement("div");
  d.className = "legend";
  d.innerHTML = [
    { c: "var(--good)", tok: "--good", g: "✓", t: "A tiempo" },
    { c: "var(--warn)", tok: "--warn", g: "!", t: `Tarde ≤ ${U.tarde_grave_min} min` },
    { c: "var(--crit)", tok: "--crit", g: "✕", t: `Tarde > ${U.tarde_grave_min} min` },
    { c: "var(--serious)", tok: "--serious", g: "↰", t: "Salió temprano" },
    { c: "var(--surface-2)", tok: null, g: "–", t: "Sin conexión" }
  ].map(i => `<span class="lg"><span class="glyph" style="background:${i.c};color:${i.tok ? sobre(i.tok) : "var(--muted)"}">${i.g}</span>${esc(i.t)}</span>`).join("");
  c.appendChild(d);

  const fechas = [...new Set(detalle.map(r => r.Fecha))].sort();
  const agentes = [...new Set(detalle.map(r => r.Agente))].sort((a, b) => corto(a).localeCompare(corto(b)));
  const idx = new Map(detalle.map(r => [r.Agente + "|" + r.Fecha, r]));
  const dow = new Map(detalle.map(r => [r.Fecha, String(r["Día"] ?? "").slice(0, 2)]));

  const PAD_L = 118, GAP = 3, OBJ = 560;
  const CELL = Math.max(18, Math.min(44, Math.floor((OBJ - PAD_L) / fechas.length) - GAP));
  const DOW = CELL >= 26, TOP = DOW ? 34 : 22;
  const W = PAD_L + fechas.length * (CELL + GAP), H = TOP + agentes.length * (CELL + GAP) + 4;
  const plot = document.createElement("div"); plot.className = "plot";
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img" }, plot);

  const paso = CELL >= 24 ? 1 : (fechas.length > 22 ? 3 : 2);
  fechas.forEach((f, j) => {
    if (j % paso) return;
    const cx = PAD_L + j * (CELL + GAP) + CELL / 2;
    svg("text", { x: cx, y: TOP - 8, "text-anchor": "middle", ...AX }, s).textContent = f.slice(8, 10);
    if (DOW) svg("text", { x: cx, y: TOP - 21, "text-anchor": "middle", ...AX, "font-size": "9.5" }, s)
      .textContent = dow.get(f) || "";
  });

  agentes.forEach((a, i) => {
    const y = TOP + i * (CELL + GAP);
    svg("text", { x: PAD_L - 10, y: y + CELL / 2 + 4, "text-anchor": "end",
                  fill: "var(--ink)", "font-size": "12", "font-weight": "500" }, s).textContent = corto(a);
    fechas.forEach((f, j) => {
      const x = PAD_L + j * (CELL + GAP);
      const r = idx.get(a + "|" + f);
      if (!r) { svg("rect", { x, y, width: CELL, height: CELL, rx: 4, fill: "none", stroke: "var(--grid)" }, s); return; }
      const st = estadoPunt(r, U);
      const g = svg("g", {}, s);
      svg("rect", { x, y, width: CELL, height: CELL, rx: 4, fill: colorEstado(st) }, g);
      svg("text", { x: x + CELL / 2, y: y + CELL / 2 + CELL * 0.17, "text-anchor": "middle",
                    "font-size": Math.min(15, CELL * 0.48), "font-weight": "700",
                    "pointer-events": "none",
                    fill: st.tok ? sobre(st.tok) : "var(--muted)" }, g).textContent = st.glifo;
      hover(g, `<div class="t-h">${esc(corto(a))} · ${esc(r.Fecha)} (${esc(r["Día"] ?? "")})</div>` +
        `<div class="t-r">Horario: <b>${esc(r.Horario ?? "—")}</b></div>` +
        `<div class="t-r">Entrada real: <b>${esc(r.Entrada || "—")}</b></div>` +
        `<div class="t-r">${esc(st.txt)}</div>`);
    });
  });

  c.appendChild(plot);
  c.appendChild(vistaTabla(["Asesor", "Fecha", "Día", "Horario", "Entrada", "Salida", "Logueado", "Estado"],
    detalle.map(r => [esc(corto(r.Agente)), esc(r.Fecha), esc(r["Día"] ?? ""), esc(r.Horario ?? ""),
      esc(r.Entrada || "—"), esc(r.Salida || "—"), esc(r.Logueado || "—"), esc(estadoPunt(r, U).txt)])));
  return c;
}

/* ══ Conexión del día ═════════════════════════════════════════════ */
function panelConexion(detalle, U, corteMin = null) {
  const c = card("half", "Conexión del día",
    corteMin == null
      ? `Entrada real contra el horario asignado. Tolerancia de ${U.tolerancia_min} minutos.`
      : `Nómina completa contra el horario asignado. Tolerancia de ${U.tolerancia_min} minutos.`);
  if (!detalle.length) { c.appendChild(vacio("Sin días laborales evaluados.")); return c; }

  const orden = { cr: 0, wa: 1, se: 2, nu: 3, ok: 4 };
  const filas = detalle.map(r => ({ r, st: estadoPunt(r, U, corteMin) }))
    .sort((a, b) => orden[a.st.k] - orden[b.st.k] || corto(a.r.Agente).localeCompare(corto(b.r.Agente)));

  const atender = filas.filter(f => f.st.k === "cr" || f.st.k === "wa").length;
  const espera = filas.filter(f => f.st.k === "nu").length;
  const res = document.createElement("p");
  res.className = "sub"; res.style.marginTop = "10px";
  const fuerte = t => `<b style="color:var(--ink)">${t}</b>`;
  // "Todavía no se conecta" solo tiene sentido con la jornada en curso. En un
  // día ya cerrado, quien no aparece es que no vino: no está en periodo de
  // gracia, y decirlo así restaría gravedad a una ausencia.
  const enCurso = corteMin != null;
  res.innerHTML = atender
    ? `${fuerte(`${atender} de ${filas.length}`)} asesores requieren atención${enCurso ? " en este corte" : ""}.`
    : espera
      ? (enCurso
        ? `Nadie fuera de tolerancia todavía: ${fuerte(espera)} aún no se conecta, dentro de los ${U.tolerancia_min} minutos de gracia.`
        : `${fuerte(espera)} sin conexión en toda la jornada; el resto cumplió horario.`)
      : `${fuerte(`Los ${filas.length} asesores`)} cumplieron horario.`;
  c.appendChild(res);

  const w = document.createElement("div");
  w.className = "tw"; w.style.marginTop = "10px";
  // Durante la jornada no se publica el logout de agent_7: unas veces es la
  // marca del informe avanzando sola y otras una desconexión real. Quien está
  // conectado sale "En jornada"; quien se quedó atrás del resto del equipo,
  // con la hora que da agent_8.
  const conexion = r => ({
    "En jornada": `<span class="pill ok"><span class="g">●</span>En jornada</span>`,
    "Jornada terminada": `<span class="pill nu"><span class="g">✓</span>Terminó ${esc(r["Sin conexión desde"])}</span>`,
    "Desconectado": `<span class="pill wa"><span class="g">○</span>Sin conexión ~${esc(r["Sin conexión desde"])}</span>`,
  })[r["Estado conexión"]] ?? esc(r.Salida || "—");

  w.innerHTML = `<table><thead><tr><th>Asesor</th><th>Horario</th><th>Entrada</th><th>${corteMin == null ? "Salida" : "Conexión"}</th><th>Logueado</th><th>Estado</th></tr></thead><tbody>` +
    filas.map(f => `<tr><td>${esc(corto(f.r.Agente))}</td><td>${esc(f.r.Horario ?? "")}</td>` +
      `<td>${esc(f.r.Entrada || "—")}</td><td>${conexion(f.r)}</td>` +
      `<td>${esc(f.r.Logueado || "—")}</td><td>${pill(f.st.k, f.st.txt, f.st.glifo)}</td></tr>`).join("") +
    `</tbody></table>`;
  c.appendChild(w);
  return c;
}

/* ══ Conexión vs efectividad (dispersión con cuadrantes) ══════════ */
function chartCruce(cruce, U) {
  const c = card("half", "Conectado ≠ productivo",
    `Cada punto es un asesor. Abajo a la derecha está el caso a atender: mucho tiempo conectado, poca gestión efectiva. La línea marca la meta de ${U.efectividad_baja} %.`);
  if (!cruce.length) { c.appendChild(vacio("Sin asesores con gestión en el periodo.")); return c; }

  const W = 560, H = 300, L = 46, R = 20, T = 14, B = 40;
  const pw = W - L - R, ph = H - T - B;
  const xs = cruce.map(r => num(r["Ocupación %"]) || 0);
  const ys = cruce.map(r => num(r["% Efectividad total"]) || 0);
  const xMax = Math.max(90, Math.ceil(Math.max(...xs) / 10) * 10);
  const xMin = Math.min(40, Math.floor(Math.min(...xs) / 10) * 10);
  const yMax = Math.max(20, Math.ceil(Math.max(...ys) / 5) * 5);
  const X = v => L + (v - xMin) / (xMax - xMin) * pw;
  const Y = v => T + ph - (v / yMax) * ph;
  const REF = 70;

  const plot = document.createElement("div"); plot.className = "plot";
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: H, role: "img" }, plot);

  for (let v = 0; v <= yMax; v += yMax / 4) {
    svg("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: "var(--grid)", "stroke-width": 1 }, s);
    svg("text", { x: L - 9, y: Y(v) + 4, "text-anchor": "end", ...AX }, s).textContent = Math.round(v) + "%";
  }
  for (let v = xMin; v <= xMax; v += 10)
    svg("text", { x: X(v), y: H - B + 18, "text-anchor": "middle", ...AX }, s).textContent = v + "%";
  svg("line", { x1: L, x2: W - R, y1: T + ph, y2: T + ph, stroke: "var(--axis)", "stroke-width": 1 }, s);
  // Los dos cortes del cuadrante: hairlines sólidas, nunca punteadas.
  svg("line", { x1: L, x2: W - R, y1: Y(U.efectividad_baja), y2: Y(U.efectividad_baja), stroke: "var(--axis)", "stroke-width": 1 }, s);
  svg("text", { x: W - R - 2, y: Y(U.efectividad_baja) - 6, "text-anchor": "end", fill: "var(--muted)", "font-size": "10.5" }, s)
    .textContent = `meta ${U.efectividad_baja} %`;
  svg("line", { x1: X(REF), x2: X(REF), y1: T, y2: T + ph, stroke: "var(--axis)", "stroke-width": 1 }, s);
  svg("text", { x: X(REF) + 5, y: T + 10, fill: "var(--muted)", "font-size": "10.5" }, s)
    .textContent = `ocupación ${REF} %`;
  svg("text", { x: W - R - 2, y: T + ph - 7, "text-anchor": "end", fill: "var(--muted)",
                "font-size": "10.5", "font-style": "italic" }, s).textContent = "conectado, poco efectivo";
  svg("text", { x: L + pw / 2, y: H - 4, "text-anchor": "middle", ...AX }, s)
    .textContent = "Aprovechamiento del tiempo conectado (ocupación)";
  svg("text", { x: 13, y: T + ph / 2, "text-anchor": "middle",
                transform: `rotate(-90 13 ${T + ph / 2})`, ...AX }, s).textContent = "Efectividad";

  cruce.forEach(r => {
    const x = X(num(r["Ocupación %"]) || 0), y = Y(num(r["% Efectividad total"]) || 0);
    const g = svg("g", {}, s);
    svg("circle", { cx: x, cy: y, r: 7, fill: "var(--surface)" }, g);   // anillo de superficie
    svg("circle", { cx: x, cy: y, r: 5, fill: "var(--s1)" }, g);
    svg("circle", { cx: x, cy: y, r: 14, fill: "transparent" }, g);     // objetivo de hover ~28px
    svg("text", { x: x + 12, y: y + 4, fill: "var(--ink-2)", "font-size": "11.5",
                  "font-weight": "500", "pointer-events": "none" }, g)
      .textContent = corto(r.Agente).split(" ")[0];
    hover(g, `<div class="t-h">${esc(corto(r.Agente))}</div>` +
      `<div class="t-r">Ocupación: <b>${fmt(num(r["Ocupación %"]))} %</b></div>` +
      `<div class="t-r">Efectividad: <b>${fmt(num(r["% Efectividad total"]))} %</b></div>` +
      `<div class="t-r">Gestiones/día: <b>${fmt(num(r["Gestiones por día"]))}</b></div>` +
      `<div class="t-r">Sin registrar: <b>${fmt(num(r["% Sin tipificar"]))} %</b></div>`);
  });

  c.appendChild(plot);
  c.appendChild(vistaTabla(
    ["Asesor", "Ocupación", "En llamada", "Fuera de línea", "Gestiones/día", "Sin registrar", "Efectivas/día", "Efectividad"],
    cruce.map(r => [esc(corto(r.Agente)), fmt(num(r["Ocupación %"])) + " %", fmt(num(r["% En llamada"])) + " %",
      fmt(num(r["% Auxiliar"])) + " %", fmt(num(r["Gestiones por día"])), fmt(num(r["% Sin tipificar"])) + " %",
      fmt(num(r["Efectivas por día"])), fmt(num(r["% Efectividad total"])) + " %"])));
  return c;
}

/* ══ Auxiliares por tipo ══════════════════════════════════════════ */
/** '3h 43m', el mismo formato que usa el Excel (gestion._horas_min). */
const hm = h => {
  const m = Math.round(h * 60);
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
};

/** Horas por estado auxiliar; con `agente`, solo las suyas.
 *
 *  Cuando un estado viene de una sola fila del dato (que es el caso al
 *  filtrar por asesor) se muestra su `Duración` textual en vez de recalcular
 *  desde `Horas`: ese campo está redondeado a dos decimales y derivar los
 *  minutos de ahí desviaba hasta un minuto respecto del Excel. Si el tablero
 *  no cuadra con la maestra al minuto, deja de ser la misma verdad. */
function horasPorEstado(aux, agente = null) {
  const acc = new Map();
  aux.filter(r => !agente || clave(r.Agente) === agente).forEach(r => {
    const k = r["Estado auxiliar"];
    const o = acc.get(k) || { estado: k, horas: 0, filas: 0, duracion: null };
    o.horas += num(r.Horas) || 0;
    o.duracion = r["Duración"];
    o.filas += 1;
    acc.set(k, o);
  });
  return [...acc.values()]
    // Bajo un minuto no es un motivo de pausa, es ruido de registro.
    .filter(o => o.horas >= 1 / 60)
    .map(o => ({ ...o, texto: (o.filas === 1 && o.duracion) ? o.duracion : hm(o.horas) }))
    .sort((a, b) => b.horas - a.horas);
}

/** El detalle se abre por asesor: la pregunta del coordinador no es
 *  "cuánto baño hubo" sino "cuánto baño lleva Laura esta semana". El
 *  periodo lo gobierna el selector de arriba, así que la misma tabla
 *  responde por día o por semana sin tocar nada más. */
function tablaAuxiliares(aux, nomina) {
  const d = document.createElement("details");
  d.className = "tv";
  d.innerHTML = `<summary>Ver los datos en tabla, por asesor</summary>`;

  // La nómina completa, no solo quien registró pausas: que un asesor no
  // aparezca porque no registró ninguna se lee como un error del tablero.
  const agentes = porClave([...aux, ...nomina])
    .sort((a, b) => corto(a).localeCompare(corto(b)));

  const barra = document.createElement("div");
  barra.className = "tv-filtro";
  const id = "aux-" + Math.random().toString(36).slice(2, 8);
  barra.innerHTML = `<label for="${id}">Asesor</label><select id="${id}">` +
    `<option value="">Todo el equipo</option>` +
    agentes.map(a => `<option value="${esc(clave(a))}">${esc(corto(a))}</option>`).join("") +
    `</select>`;

  const cont = document.createElement("div");

  function pintar(agente) {
    const filas = horasPorEstado(aux, agente || null);
    if (!filas.length) {
      cont.innerHTML = `<div class="empty">${agente
        ? esc(corto(agente)) + " no registró auxiliares en el periodo."
        : "Sin auxiliares registrados en el periodo."}</div>`;
      return;
    }
    const total = filas.reduce((a, o) => a + o.horas, 0);
    cont.innerHTML = `<div class="tw"><table><thead><tr>` +
      `<th>Estado auxiliar</th><th>Tiempo</th><th>Participación</th>` +
      `</tr></thead><tbody>` +
      filas.map(o =>
        `<tr><td>${esc(o.estado)}</td><td>${esc(o.texto)}</td>` +
        `<td>${fmt(total ? o.horas / total * 100 : 0)} %</td></tr>`).join("") +
      `<tr><td><b>Total fuera de línea</b></td><td><b>${hm(total)}</b></td><td></td></tr>` +
      `</tbody></table></div>`;
  }

  barra.querySelector("select").addEventListener("change", e => pintar(e.target.value));
  pintar("");
  d.append(barra, cont);
  return d;
}

function chartAuxiliares(aux, nomina = []) {
  const c = card("half", "Tiempo fuera de línea, por motivo",
    "Suma del equipo en el periodo, ordenada por duración: lo primero de la lista es donde hay algo que revisar. El detalle se abre por asesor.");
  const rows = horasPorEstado(aux);
  if (!rows.length) { c.appendChild(vacio("Sin auxiliares registrados en el periodo.")); return c; }

  const PAD_L = 132, PAD_R = 54, BH = 18, GAP_ROW = 12, TOP = 4, W = 560;
  const H = TOP + rows.length * (BH + GAP_ROW), max = rows[0].horas || 1;
  const plot = document.createElement("div"); plot.className = "plot";
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: H, role: "img" }, plot);

  rows.forEach((o, i) => {
    const y = TOP + i * (BH + GAP_ROW);
    svg("text", { x: PAD_L - 10, y: y + BH / 2 + 4, "text-anchor": "end", fill: "var(--ink)", "font-size": "12" }, s)
      .textContent = o.estado;
    const w = Math.max(2, (W - PAD_L - PAD_R) * o.horas / max);
    const p = svg("path", { d: rrect(PAD_L, y, w, BH, 0, 4, 4, 0), fill: "var(--s1)" }, s);
    hover(p, `<div class="t-h">${esc(o.estado)}</div>` +
             `<div class="t-r">Total del equipo: <b>${esc(o.texto)}</b></div>`);
    svg("text", { x: PAD_L + w + 8, y: y + BH / 2 + 4, fill: "var(--ink-2)",
                  "font-size": "11.5", "font-weight": "600" }, s).textContent = o.texto;
  });

  c.appendChild(plot);
  c.appendChild(tablaAuxiliares(aux, nomina));
  return c;
}

/* ══ Curva horaria ════════════════════════════════════════════════ */
const CANALES = [
  { k: "Llamadas", label: "Llamadas", color: "var(--s1)", tok: "--s1" },
  { k: "Digitales abiertas", label: "Digitales abiertas", color: "var(--s3)", tok: "--s3" },
  { k: "Digitales", label: "Digitales cerradas", color: "var(--s2)", tok: "--s2" }
];

/** Agrupa la curva por hora; con `agente`, solo la suya. */
function porHora(curva, agente = null) {
  const acc = new Map();
  curva.filter(r => !agente || clave(r.Agente) === agente).forEach(r => {
    const h = num(r.Hora);
    if (h == null) return;
    const o = acc.get(h) || { hora: h, Llamadas: 0, Digitales: 0,
                              "Digitales abiertas": 0, agentes: new Map() };
    const voz = num(r.Llamadas) || 0, dig = num(r.Digitales) || 0;
    o.Llamadas += voz;
    o.Digitales += dig;
    o["Digitales abiertas"] += num(r["Digitales abiertas"]) || 0;
    const a = o.agentes.get(r.Agente) || [0, 0];
    o.agentes.set(r.Agente, [a[0] + voz, a[1] + dig]);
    acc.set(h, o);
  });
  return [...acc.values()].sort((a, b) => a.hora - b.hora);
}

function tablaCurva(curva, nomina) {
  const d = document.createElement("details");
  d.className = "tv";
  d.innerHTML = `<summary>Ver los datos en tabla, por asesor</summary>`;

  const agentes = porClave([...curva, ...nomina])
    .sort((a, b) => corto(a).localeCompare(corto(b)));

  const barra = document.createElement("div");
  barra.className = "tv-filtro";
  const id = "curva-" + Math.random().toString(36).slice(2, 8);
  barra.innerHTML = `<label for="${id}">Asesor</label><select id="${id}">` +
    `<option value="">Todo el equipo</option>` +
    agentes.map(a => `<option value="${esc(clave(a))}">${esc(corto(a))}</option>`).join("") + `</select>`;

  const cont = document.createElement("div");
  function pintar(agente) {
    const filas = porHora(curva, agente || null);
    if (!filas.length) {
      cont.innerHTML = `<div class="empty">${agente
        ? esc(corto(agente)) + " no registró gestiones en el periodo."
        : "Sin gestiones registradas."}</div>`;
      return;
    }
    const tv = filas.reduce((a, o) => a + o.Llamadas, 0);
    const ta = filas.reduce((a, o) => a + o["Digitales abiertas"], 0);
    const td = filas.reduce((a, o) => a + o.Digitales, 0);
    cont.innerHTML = `<div class="tw"><table><thead><tr>` +
      `<th>Hora</th><th>Llamadas</th><th>Digitales abiertas</th><th>Digitales cerradas</th>` +
      `</tr></thead><tbody>` +
      filas.map(o => `<tr><td>${String(o.hora).padStart(2, "0")}:00</td>` +
        `<td>${o.Llamadas}</td><td>${o["Digitales abiertas"]}</td>` +
        `<td>${o.Digitales}</td></tr>`).join("") +
      `<tr><td><b>Total</b></td><td><b>${tv}</b></td><td><b>${ta}</b></td>` +
      `<td><b>${td}</b></td></tr></tbody></table></div>`;
  }
  barra.querySelector("select").addEventListener("change", e => pintar(e.target.value));
  pintar("");
  d.append(barra, cont);
  return d;
}

function chartCurva(curva, nomina = []) {
  const c = card("half", "Gestiones por hora",
    "Voz y digital en paralelo. La llamada se cuenta cuando ocurre; la conversación " +
    "digital, cuando se cierra —que es cuando el asesor la tipificó—. Contarla por su " +
    "apertura mezclaría días: Wolkvox devuelve conversaciones de ayer que cerraron hoy.");
  if (!curva.length) { c.appendChild(vacio("Sin gestiones registradas en el día.")); return c; }
  c.appendChild(legend(CANALES));

  const rows = porHora(curva);
  const W = 560, H = 220, L = 38, R = 12, T = 14, B = 32;
  const pw = W - L - R, ph = H - T - B;
  const max = Math.max(1, ...rows.flatMap(r => CANALES.map(c => r[c.k])));
  const step = Math.ceil(max / 4 / 5) * 5 || 5;
  const yMax = Math.ceil(max / step) * step;
  const franja = pw / rows.length;
  const bw = Math.max(3, Math.min(12, franja / CANALES.length - 2));

  const plot = document.createElement("div"); plot.className = "plot";
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: H, role: "img" }, plot);

  for (let v = 0; v <= yMax; v += step) {
    const y = T + ph - v / yMax * ph;
    svg("line", { x1: L, x2: W - R, y1: y, y2: y,
                  stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, s);
    svg("text", { x: L - 8, y: y + 4, "text-anchor": "end", ...AX }, s).textContent = v;
  }

  rows.forEach((r, i) => {
    const cx = L + (i + 0.5) * franja;
    const g = svg("g", {}, s);
    CANALES.forEach((canal, j) => {
      const v = r[canal.k];
      if (v <= 0) return;
      const h = v / yMax * ph, y = T + ph - h;
      // Las barras se reparten centradas en la franja, con 2px de aire.
      const ancho = CANALES.length * (bw + 2) - 2;
      const x = cx - ancho / 2 + j * (bw + 2);
      svg("path", { d: rrect(x, y, bw, h, 4, 4, 0, 0), fill: canal.color }, g);
    });
    svg("rect", { x: cx - franja / 2, y: T, width: franja, height: ph, fill: "transparent" }, g);

    const det = [...r.agentes.entries()]
      .sort((a, b) => (b[1][0] + b[1][1]) - (a[1][0] + a[1][1]))
      .map(([a, [voz, dig]]) => `<div class="t-r">${esc(corto(a))}: <b>${voz}</b> voz · <b>${dig}</b> digital</div>`)
      .join("");
    hover(g, `<div class="t-h">${String(r.hora).padStart(2, "0")}:00 – ${String(r.hora + 1).padStart(2, "0")}:00</div>` +
      CANALES.map(c => `<div class="t-r">${esc(c.label)}: <b>${r[c.k]}</b></div>`).join("") + det);

    svg("text", { x: cx, y: H - B + 16, "text-anchor": "middle", ...AX }, s)
      .textContent = String(r.hora).padStart(2, "0");
  });
  svg("text", { x: L + pw / 2, y: H - 2, "text-anchor": "middle", ...AX }, s).textContent = "Hora del día";

  c.appendChild(plot);
  c.appendChild(tablaCurva(curva, nomina));
  return c;
}


/* ══ Tipificaciones ═══════════════════════════════════════════════ */
function chartTipificaciones(tip) {
  const c = card("half", "Tipificaciones usadas",
    "Qué códigos aplica la operación, separados por canal: los de voz y los digitales " +
    "no son los mismos ni comparables, y sumarlos escondería que uno domina en un canal " +
    "y no existe en el otro. La parte sólida de cada barra es lo efectivo.");
  if (!tip.length) { c.appendChild(vacio("Sin gestiones tipificadas en el periodo.")); return c; }

  const barra = document.createElement("div");
  barra.className = "tv-filtro";
  const id = "tip-" + Math.random().toString(36).slice(2, 8);
  const orden = ["Voz", "Digital"];
  const canales = [...new Set(tip.map(r => r.Canal))]
    .sort((a, b) => orden.indexOf(a) - orden.indexOf(b));
  barra.innerHTML = `<label for="${id}">Canal</label><select id="${id}">` +
    canales.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("") + `</select>`;
  c.appendChild(barra);

  const cont = document.createElement("div");
  c.appendChild(cont);

  function pintar(canal) {
    cont.innerHTML = "";
    const rows = tip.filter(r => r.Canal === canal)
      .sort((a, b) => (num(b.Gestiones) || 0) - (num(a.Gestiones) || 0));
    if (!rows.length) { cont.appendChild(vacio("Sin gestiones en este canal.")); return; }

    const PAD_L = 168, PAD_R = 78, BH = 18, GAP = 12, TOP = 4, W = 560;
    const H = TOP + rows.length * (BH + GAP), max = num(rows[0].Gestiones) || 1;
    const plot = document.createElement("div"); plot.className = "plot";
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: H, role: "img" }, plot);

    rows.forEach((r, i) => {
      const y = TOP + i * (BH + GAP);
      const n = num(r.Gestiones) || 0, ef = num(r.Efectivas) || 0;
      svg("text", { x: PAD_L - 10, y: y + BH / 2 + 4, "text-anchor": "end",
                    fill: "var(--ink)", "font-size": "11.5" }, s)
        .textContent = String(r["Código"]).slice(0, 26);
      const w = Math.max(2, (W - PAD_L - PAD_R) * n / max);
      // La parte efectiva se pinta encima, en el mismo carril: se ve de un
      // golpe cuánto de ese código realmente cumplió objetivo.
      svg("path", { d: rrect(PAD_L, y, w, BH, 0, 4, 4, 0), fill: "var(--bar-quiet)" }, s);
      if (ef > 0)
        svg("path", { d: rrect(PAD_L, y, Math.max(2, w * ef / n), BH, 0, 4, 4, 0),
                      fill: "var(--s1)" }, s);
      const g = svg("g", {}, s);
      svg("rect", { x: PAD_L, y, width: W - PAD_L - PAD_R, height: BH, fill: "transparent" }, g);
      hover(g, `<div class="t-h">${esc(r["Código"])}</div>` +
        `<div class="t-r">Gestiones: <b>${n}</b></div>` +
        `<div class="t-r">Efectivas: <b>${ef}</b> (${fmt(num(r["% Efectividad"]))} %)</div>`);
      svg("text", { x: PAD_L + w + 8, y: y + BH / 2 + 4, fill: "var(--ink-2)",
                    "font-size": "11", "font-weight": "600" }, s)
        .textContent = `${n}  ·  ${fmt(num(r["% Efectividad"]), 0)}%`;
    });
    cont.appendChild(plot);
    cont.appendChild(vistaTabla(["Código", "Gestiones", "Efectivas", "% Efectividad"],
      rows.map(r => [esc(r["Código"]), r.Gestiones, r.Efectivas,
                     fmt(num(r["% Efectividad"])) + " %"])));
  }
  barra.querySelector("select").addEventListener("change", e => pintar(e.target.value));
  pintar(canales[0]);
  return c;
}

/* ══ Semáforo ═════════════════════════════════════════════════════ */
function semaforo(cruce, puntAgente, U) {
  const c = card("", "Semáforo del equipo",
    "Una fila por asesor. Las alertas son las que ya calcula el pipeline; los umbrales vienen de horarios.yaml y se muestran junto a cada columna para que no haya que adivinarlos.");
  if (!cruce.length) { c.appendChild(vacio("Sin asesores evaluados en el periodo.")); return c; }

  // Por clave y no por texto: cruzar la grafia de la API contra la del
  // YAML fallaba en silencio y el asesor salia con "0 de 0" dias.
  const punt = new Map(puntAgente.map(r => [clave(r.Agente), r]));
  const filas = [...cruce]
    .sort((a, b) => (num(a["% Efectividad total"]) || 0) - (num(b["% Efectividad total"]) || 0))
    .map(r => {
      const p = punt.get(clave(r.Agente)) || {};
      const pTarde = num(p["% Entradas tarde"]) || 0;
      const nTarde = num(p["Entradas tarde"]) || 0;
      const nDias = num(p["Días trabajados"]) || 0;
      const aux = num(r["% Auxiliar"]) || 0;
      const sin = num(r["% Sin tipificar"]) || 0;
      const ef = num(r["% Efectividad total"]) || 0;
      const alertas = String(r.Alerta || "").split("|").map(s => s.trim()).filter(Boolean);
      return [
        esc(corto(r.Agente)),
        pTarde > U.entradas_tarde_alto ? pill("cr", `${nTarde} de ${nDias}`, "✕") : pill("ok", `${nTarde} de ${nDias}`, "✓"),
        aux > U.auxiliar_alto ? pill("cr", fmt(aux) + " %", "✕")
          : (aux > U.auxiliar_alto - 8 ? pill("wa", fmt(aux) + " %", "!") : pill("ok", fmt(aux) + " %", "✓")),
        sin > U.sin_tipificar_alto ? pill("cr", fmt(sin) + " %", "✕") : pill("ok", fmt(sin) + " %", "✓"),
        ef < U.efectividad_baja ? pill("cr", fmt(ef) + " %", "✕") : pill("ok", fmt(ef) + " %", "✓"),
        `<span style="font-variant-numeric:tabular-nums">${fmt(num(r["Gestiones por día"]), 0)}</span>`,
        alertas.length ? `<div class="alertas">${alertas.map(a => pill("wa", a, "!")).join("")}</div>`
                       : pill("ok", "Sin alertas", "✓")
      ];
    });

  const w = document.createElement("div");
  w.className = "tw"; w.style.marginTop = "12px";
  w.innerHTML = `<table><thead><tr>
      <th>Asesor</th><th>Días tarde<br><span>meta ≤ ${U.entradas_tarde_alto} %</span></th>
      <th>Fuera de línea<br><span>meta ≤ ${U.auxiliar_alto} %</span></th>
      <th>Sin registrar<br><span>meta ≤ ${U.sin_tipificar_alto} %</span></th>
      <th>Efectividad<br><span>meta ≥ ${U.efectividad_baja} %</span></th>
      <th>Gestiones/día</th><th>Foco de acompañamiento</th>
    </tr></thead><tbody>${filas.map(f => `<tr>${f.map(v => `<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  c.appendChild(w);
  return c;
}

/* ══ KPIs ═════════════════════════════════════════════════════════ */
function kpi({ label, valor, unidad, delta, deltaLabel, meta, mejorEs }) {
  const d = document.createElement("div");
  d.className = "kpi";
  let dHtml = "";
  if (delta != null && Number.isFinite(delta)) {
    const mejora = mejorEs === "menor" ? delta < 0 : delta > 0;
    const plano = Math.abs(delta) < 0.05;
    const cls = plano ? "flat" : (mejora ? "up" : "down");
    const flecha = plano ? "→" : (delta > 0 ? "▲" : "▼");
    dHtml = `<span class="delta ${cls}">${flecha} ${fmt(Math.abs(delta))}${unidad === "%" ? " pts" : ""}</span>`;
  }
  d.innerHTML = `<span class="k-label">${esc(label)}</span>` +
    `<span class="k-value">${valor}${unidad ? `<span class="u">${unidad}</span>` : ""}</span>` +
    `<span class="k-foot">${dHtml}<span class="k-meta">${esc(deltaLabel || meta || "")}</span></span>`;
  return d;
}

/* ══ Render de un periodo ═════════════════════════════════════════ */
/* El foco cambia con la hora del corte: a las 08:10 no hay produccion que
   medir y la unica pregunta es si el equipo esta completo; a las 14:10 la
   pregunta es quien no volvio del almuerzo. Se elige el ultimo foco cuya
   hora de arranque ya paso, para que sirva a cualquier hora de corrida. */
const FOCOS = [
  { desde: 0, t: "Arranque de jornada",
    p: "Quién está conectado y quién no. Todavía no hay producción que medir: la única pregunta es si el equipo está completo." },
  { desde: 8 * 60 + 25, t: "Rezagados",
    p: "Consumida la gracia de entrada. Quien siga sin conectarse ya es una ausencia, no un retraso: toca llamar, no anotar." },
  { desde: 8 * 60 + 55, t: "Confirmación de asistencia",
    p: "La jornada ya debería estar completa. Lo que aparezca sin conexión a esta hora se reporta hoy, no en el informe del lunes." },
  { desde: 9 * 60 + 25, t: "Primera hora cerrada",
    p: "Cierra la primera hora de producción. Sirve para detectar a quien entró pero no arrancó." },
  { desde: 11 * 60, t: "Salida a almuerzo",
    p: "Control de cobertura: cuántos salieron a la vez y cuántos quedan en línea. El riesgo no es que almuercen, es que almuercen todos juntos." },
  { desde: 13 * 60 + 30, t: "Regreso de almuerzo",
    p: "Quién excedió el tiempo de almuerzo y quién no ha vuelto a estado productivo. Es el corte donde más pesa el detalle de auxiliares." },
  { desde: 15 * 60 + 30, t: "Avance de gestión",
    p: "Queda poca jornada. Con el acumulado del día se ve si la meta es alcanzable o si hay que redistribuir base ahora mismo." },
  { desde: 17 * 60 + 30, t: "Cierre del día",
    p: "Jornada completa. El foco pasa a lo pendiente: gestiones sin tipificar y salidas anticipadas, que es lo que se corrige mañana." },
];
const focoDe = min => FOCOS.reduce((elegido, f) => (min >= f.desde ? f : elegido), FOCOS[0]);

const NOMBRE_TIPO = { dia: "Día", semana: "Semana", mes: "Mes" };
// "Todo el semana" chirría: cada alcance lleva su artículo.
const TODO_EL = { semana: "Toda la semana", mes: "Todo el mes" };
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio",
               "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

/** "2026-S31" -> "semana 31". La etiqueta del archivo no se le muestra al
 *  coordinador; en pantalla se nombra el periodo como lo nombra él. */
function nombreCorto(p) {
  const e = p.etiqueta || "";
  if (p.periodo === "semana") return `semana ${e.split("-S")[1].replace(/^0/, "")}`;
  if (p.periodo === "mes") return `${MESES[parseInt(e.slice(5, 7), 10) - 1]}`;
  return `${e.slice(8, 10)}/${e.slice(5, 7)}`;
}

/** El periodo inmediatamente anterior del mismo tipo dentro del almacén. */
function anterior(p) {
  const mismos = PERIODOS.filter(x => x.periodo === p.periodo && x.desde < p.desde);
  return mismos.length ? mismos[0] : null;   // PERIODOS viene del más reciente al más antiguo
}

/** Los cuadros del periodo, o los de un solo día si hay filtro.
 *
 *  El día viene ya resuelto desde el dominio (`*_dia`), no se re-agrega aquí:
 *  promediar porcentajes en el navegador daría cifras que no cuadran con
 *  ningún informe. Filtrar un día da, por construcción, lo mismo que el
 *  informe diario de esa fecha.
 */
function recortar(C, dia) {
  if (!dia) return C;
  const del = (filas, campo) => (filas || []).filter(r => r.Fecha === dia).map(r => {
    const { Fecha, ...resto } = r;
    return resto;
  });
  return {
    ...C,
    puntualidad_detalle: (C.puntualidad_detalle || []).filter(r => r.Fecha === dia),
    tiempos: del(C.tiempos_dia),
    cruce: del(C.cruce_dia),
    auxiliares: del(C.auxiliares_dia_detalle),
    curva_horaria: del(C.curva_dia),
  };
}

/** Fechas con datos dentro del periodo, para poblar el filtro. */
function diasDe(C) {
  const fechas = new Set();
  ["cruce_dia", "curva_dia", "auxiliares_dia_detalle"].forEach(k =>
    (C[k] || []).forEach(r => { if (r.Fecha) fechas.add(r.Fecha); }));
  (C.puntualidad_detalle || []).forEach(r => { if (r.Fecha) fechas.add(r.Fecha); });
  return [...fechas].sort();
}

let diaFiltrado = null;

/** KPIs del periodo, o los del día filtrado.
 *
 *  Vienen resueltos desde el dominio igual que los cuadros: si la cabecera
 *  siguiera mostrando la semana con el resto filtrado, se leerían dos
 *  periodos distintos en la misma pantalla.
 */
function kpisDe(p, dia) {
  if (!dia) return p.kpis;
  const filas = (p.cuadros.general_dia || []).filter(r => r.Fecha === dia);
  if (!filas.length) return {};
  return Object.fromEntries(filas.map(r => [String(r.Indicador).trim(), r.Valor]));
}

function render(p) {
  const U = p.umbrales;
  const C = recortar(p.cuadros, diaFiltrado);
  const K = kpisDe(p, diaFiltrado);
  const prev = anterior(p);
  const etiquetaDelta = prev ? `vs. ${nombreCorto(prev)}` : "sin periodo previo";
  const d = clave => {
    if (!prev) return null;
    const a = num(K[clave]), b = num(prev.kpis[clave]);
    return (a == null || b == null) ? null : a - b;
  };

  const corteMin = p.corte ? HHMM(p.corte) : null;

  // ── Foco ──
  const cruce = C.cruce || [];
  const conAlerta = cruce.filter(r => String(r.Alerta || "").trim()).length;
  if (corteMin != null) {
    const f = focoDe(corteMin);
    $("#foco-t").textContent = `${p.corte} · ${f.t}`;
    $("#foco-p").textContent = f.p;
  } else {
    $("#foco-t").textContent = diaFiltrado
      ? `${p.titulo || p.etiqueta} — ${diaFiltrado.slice(8, 10)}/${diaFiltrado.slice(5, 7)}`
      : (p.titulo || p.etiqueta);
    if (cruce.length) {
      const peor = [...cruce].sort((a, b) => (num(a["% Efectividad total"]) || 0) - (num(b["% Efectividad total"]) || 0))[0];
      $("#foco-p").textContent =
        `${conAlerta} de ${cruce.length} asesores traen alerta. El caso más marcado es ${corto(peor.Agente)}: ` +
        `${fmt(num(peor["% Efectividad total"]))} % de efectividad con ${fmt(num(peor["Ocupación %"]))} % de ocupación. ` +
        `El problema transversal del periodo es el registro: ${K["% Sin tipificar"] ?? "—"} de las gestiones no quedan tipificadas.`;
    } else {
      $("#foco-p").textContent = "Sin gestión registrada en el periodo.";
    }
  }

  // ── KPIs ──
  const kw = $("#kpis");
  kw.innerHTML = "";
  kw.appendChild(kpi({ label: "Entradas tarde", valor: fmt(num(K["% Entradas tarde (operación)"])), unidad: "%",
    delta: d("% Entradas tarde (operación)"), deltaLabel: etiquetaDelta, mejorEs: "menor" }));
  kw.appendChild(kpi({ label: "Aprovechamiento del tiempo conectado", valor: fmt(num(K["Ocupación promedio"])), unidad: "%",
    delta: d("Ocupación promedio"), deltaLabel: etiquetaDelta, mejorEs: "mayor" }));
  kw.appendChild(kpi({ label: "Gestiones sin registrar", valor: fmt(num(K["% Sin tipificar"])), unidad: "%",
    delta: d("% Sin tipificar"), deltaLabel: etiquetaDelta, mejorEs: "menor" }));
  kw.appendChild(kpi({ label: "Efectividad", valor: fmt(num(K["% Efectividad global (sobre lo tipificado)"])), unidad: "%",
    delta: d("% Efectividad global (sobre lo tipificado)"), deltaLabel: etiquetaDelta, mejorEs: "mayor" }));
  kw.appendChild(kpi({ label: "Gestiones totales", valor: int(num(K["Gestiones totales (operación)"])),
    meta: `${int(num(K["Llamadas"]))} voz · ${int(num(K["Interacciones digitales"]))} digital` }));

  // ── Gráficos ──
  const g = $("#grid");
  g.innerHTML = "";
  if (p.periodo === "dia" || diaFiltrado) {
    g.appendChild(panelConexion(C.puntualidad_detalle || [], U, corteMin));
    g.appendChild(chartCurva(C.curva_horaria || [], C.puntualidad_agente || []));
    if (diaFiltrado) g.appendChild(chartCruce(cruce, U));
  } else {
    g.appendChild(chartCalendario(C.puntualidad_detalle || [], U));
    g.appendChild(chartCruce(cruce, U));
  }
  g.appendChild(chartDistribucion(C.tiempos || []));
  g.appendChild(chartAuxiliares(C.auxiliares || [], C.puntualidad_agente || []));
  g.appendChild(chartTipificaciones(C.tipificaciones || []));
  g.appendChild(semaforo(cruce, C.puntualidad_agente || [], U));

  // ── Cabecera y pie ──
  const enlace = p.archivo_excel
    ? `Detalle completo: <a href="${esc(p.archivo_excel)}">${esc(p.archivo_excel)}</a>`
    : `<span style="color:var(--muted)">La maestra de este periodo ya salió de la retención</span>`;
  $("#meta").innerHTML =
    (corteMin != null
      ? `Jornada en curso · <b>corte ${esc(p.corte)}</b>`
      : `Periodo <b>${esc(p.etiqueta)}</b>`) +
    `<br>${enlace}<br>Generado <b>${esc(p.generado || DATA.generado || "")}</b>`;
  $("#pie").innerHTML =
    (corteMin != null
      ? `<p>Estas cifras son una foto del corte de las ${esc(p.corte)}, no dato en vivo. ` +
        `La siguiente corrida las reemplaza.</p>`
      : "") +
    `<p>El Excel sigue siendo la fuente auditable: este tablero solo presenta las mismas cifras. ` +
    `Si un número difiere entre los dos, manda el Excel y hay un error de presentación que reportar.</p>` +
    `<p>Corrida: <code>main.py --analisis --periodo ${esc(p.periodo)}${corteMin != null ? " --hoy" : ""}</code> · ` +
    `Tolerancia de horario: ${U.tolerancia_min} min · Periodos en el histórico: ${PERIODOS.length}</p>`;
  tipOff();
}

/* ══ Controles ════════════════════════════════════════════════════ */
const TIPOS = ["dia", "semana", "mes"].filter(t => PERIODOS.some(p => p.periodo === t));
let tipo = TIPOS[0];

(() => {   // estado inicial desde el hash: #tipo=semana&periodo=2026-S32
  const q = new URLSearchParams(location.hash.slice(1));
  const t = q.get("tipo");
  if (TIPOS.includes(t)) tipo = t;
})();

function periodoInicial() {
  const q = new URLSearchParams(location.hash.slice(1));
  const p = q.get("periodo");
  const delTipo = PERIODOS.filter(x => x.periodo === tipo);
  return (p && delTipo.some(x => x.etiqueta === p)) ? p : (delTipo[0] || {}).etiqueta;
}

function pintar(etiqueta) {
  $("#seg").innerHTML = TIPOS.map(t =>
    `<button type="button" data-tipo="${t}" aria-pressed="${t === tipo}">${NOMBRE_TIPO[t]}</button>`).join("");
  $("#seg").querySelectorAll("[data-tipo]").forEach(b =>
    b.addEventListener("click", () => { tipo = b.dataset.tipo; diaFiltrado = null; pintar(); }));

  const delTipo = PERIODOS.filter(x => x.periodo === tipo);
  const sel = $("#sel");
  sel.innerHTML = delTipo.map(x => `<option value="${esc(x.etiqueta)}">${esc(x.titulo || x.etiqueta)}</option>`).join("");
  const elegido = (etiqueta && delTipo.some(x => x.etiqueta === etiqueta)) ? etiqueta : (delTipo[0] || {}).etiqueta;
  if (elegido) sel.value = elegido;
  $("#pick").hidden = delTipo.length < 2;

  const p = delTipo.find(x => x.etiqueta === elegido);
  if (!p) return;

  // El filtro de día solo tiene sentido en periodos de varios días.
  const dias = tipo === "dia" ? [] : diasDe(p.cuadros);
  $("#pick-dia").hidden = dias.length < 2;
  if (dias.length < 2) diaFiltrado = null;
  if (diaFiltrado && !dias.includes(diaFiltrado)) diaFiltrado = null;
  const selDia = $("#sel-dia");
  selDia.innerHTML = `<option value="">${TODO_EL[tipo] || "Todo el periodo"}</option>` +
    dias.map(d => `<option value="${d}">${d.slice(8, 10)}/${d.slice(5, 7)}</option>`).join("");
  selDia.value = diaFiltrado || "";

  render(p);
}

$("#sel").addEventListener("change", e => { diaFiltrado = null; pintar(e.target.value); });
$("#sel-dia").addEventListener("change", e => {
  diaFiltrado = e.target.value || null;
  pintar($("#sel").value);
});

if (!PERIODOS.length) {
  $("#foco-t").textContent = "Sin periodos en el histórico";
  $("#foco-p").textContent = "Ninguna corrida ha dejado datos todavía. Ejecuta main.py --analisis para generar el primero.";
} else {
  pintar(periodoInicial());
}
</script>
